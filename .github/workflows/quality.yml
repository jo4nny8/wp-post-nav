name: WP Post Nav quality

on:
  pull_request:
  push:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  static:
    name: Static checks and unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, mysql
          coverage: none

      - name: Validate Composer configuration
        run: composer validate --no-check-publish

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Check PHP syntax
        run: composer run lint:php

      - name: Run PHPUnit unit tests
        run: composer run test

      - name: Run PHPCS
        continue-on-error: true
        run: composer run lint:phpcs

      - name: Run PHPStan
        continue-on-error: true
        run: composer run analyse

      - name: Build and verify distribution package
        run: composer run build

      - name: Verify distribution ZIP
        run: unzip -t wp-post-nav.zip

  integration:
    name: WordPress integration tests
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, mysql
          coverage: none

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Install WordPress test library
        env:
          WP_TESTS_DIR: /tmp/wordpress-tests-lib
        run: |
          curl --fail --silent --show-error --location \
            https://develop.svn.wordpress.org/trunk/tests/phpunit/bin/install-wp-tests.sh \
            --output /tmp/install-wp-tests.sh
          chmod +x /tmp/install-wp-tests.sh
          /tmp/install-wp-tests.sh wordpress_test root root 127.0.0.1 latest

      - name: Run WordPress integration tests
        env:
          WP_TESTS_DIR: /tmp/wordpress-tests-lib
        run: composer run test:integration
